---
- name: Установка Docker и PostgreSQL для развертывания Wordpress
  hosts: all
  become: true
  vars:
    docker_users: [vald3mar]
    postgres_root_pswd: admin
    postgres_db: wordpress
    postgres_user: wp_user
    postgres_pswd: wp_pswd
    db_port: 5432           
    wp_port: 8080 

  tasks:
    - name: Установка Docker
      block:
        - name: Установка нужных пакетов
          ansible.builtin.apt:
            name: "{{ item }}"
            state: present
            update_cache: true
          loop:
            - apt-transport-https
            - ca-certificates
            - curl
            - software-properties-common

        - name: Добавить GPG-ключ Docker
          ansible.builtin.apt_key:
            url: https://download.docker.com/linux/ubuntu/gpg
            state: present

        - name: Добавление Docker репозитория
          ansible.builtin.apt_repository:
            repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ansible_lsb.codename}} stable"
            state: present
            mode: "0644"

        - name: Установить Docker
          ansible.builtin.apt:
            name: "{{ item }}"
            state: present
            update_cache: true
          loop:
            - docker-ce
            - docker-ce-cli
            - containerd.io

        - name: Добавить пользователя в группу Docker
          ansible.builtin.user:
            name: "{{ ansible_user }}"
            groups: docker
            append: true
            
        - name: Запустить Docker
          ansible.builtin.service:
            name: docker
            state: started
            enabled: true

    - name: Инициализация Docker-сети
      community.docker.docker_network:
        name: wp_net
        state: present

    - name: Запустить контейнер с PostgreSQL и проверить статус
      block:
      - name: Установка контейнера
        community.docker.docker_container:
          name: postgres
          image: postgres:latest
          restart_policy: always
          env:
            POSTGRES_ROOT_PASSWORD: "{{ postgres_root_pswd }}"
            POSTGRES_DB: "{{ postgres_db }}"
            POSTGRES_USER: "{{ postgres_user }}"
            POSTGRES_PASSWORD: "{{ postgres_pswd }}"
          ports:
            - "5432:5432"
          networks:
            - name: wp_net
          volumes:
            - postgres_data:/var/lib/postgresql/data

      - name: Проверить, что PostgreSQL контейнер запущен
        shell: docker ps --filter "name=postgres" --format "{{ '{{' }}.Status{{ '}}' }}"
        register: postgres_status

      - name: Вывести статус PostgreSQL контейнера
        debug:
          msg: "PostgreSQL контейнер статус: {{ postgres_status.stdout }}"

    - name: Запустить контейнер с WordPress
      community.docker.docker_container:
        name: wordpress
        image: wordpress:latest
        restart_policy: always
        env:
          WORDPRESS_DB_HOST: "postgres:{{ db_port }}"
          WORDPRESS_DB_NAME: "{{ postgres_db }}"
          WORDPRESS_DB_USER: "{{ postgres_user }}" 
          WORDPRESS_DB_PASSWORD: "{{ postgres_pswd }}"
        ports:
          - "{{ wp_port }}:80"
        networks:
          - name: wp_net
        volumes:
          - wordpress_data:/var/www/html

              


            

          