---
- name: Установка Docker и PostgreSQL для развертывания Wordpress
  hosts: all
  become: yes
  vars:
    docker_users: [vald3mar]
    postgres_root_password: admin
    postgres_database: wordpress
    postgres_user: wp_user
    postgres_pswd: wp_pswd

  tasks:
    - name: Установка Docker
      block:
        - name: Установка нужных пакетов
          ansible.builtin.apt:
            name: "{{ item }}"
            state: present
            update_cache: true
          loop:
            - apt-transport-https
            - ca-certificates
            - curl
            - sofrware-properties-common

        - name: Добавить GPG-ключ Docker
          ansible.builtin.apt_key:
            url: https://download.docker.com/linux/ubuntu/gpg
            state: present

        - name: Добавление Docker репозитория
          ansible.builtin.apt_repository:
            repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ansible_lsb.codename}} stable"
            state: present
            mode: "0644"

        - name: Установить Docker
          ansible.builtin.apt:
            name: "{{ item }}"
            state: present
            update_cache: true
          loop:
            - docker-ce
            - docker-ce-cli
            - containerd.io

        - name: Добавить пользователя в группу Docker
          ansible.builtin.user:
            name: "{{ ansible_user }}"
            groups: docker
            append: true
            
        - name: Запустить Docker
          ansible.builtin.service:
            name: docker
            state: started
            enabled: true

    - name: Инициализация Docker-сети
      community.docker.docker_network:
        name: wp_net
        state: present

    - name: Запуск контейнера с Постгрей
      block:
        - name: Установка образа с PostgreSQL
          community.docker.docker_container:
            name: postgres
            image: postgres:latest
            restart_policy: always
          environment:
            POSTGRES_ROOT_PASSWORD: "{{ postgres_root_password }}"
            POSTGRES_DATABASE: "{{ postgres_database }}"
            POSTGRES_USER: "{{ postgres_user }}"
            POSTGRES_PASSWORD: "{{ postgres_pswd }}"
          ports:
            - "5432:5432"
          networks:
            - name: wp_net
          volumes:
            - postgresdb_data:/var/lib/postgres

              


            

          