---
#я создал этот блок задач с целью отладки, чтобы он чистил мне старое состояние конфигурации после предыдущего запуска плейбука
- name: Очистка и подготовка сервера
  hosts: all
  become: true
  tasks:
    - name: Остановка и удаление контейнеров
      shell: |
        docker stop $(docker ps -aq) 2>/dev/null || true
        docker rm -f $(docker ps -aq) 2>/dev/null || true
        docker volume rm $(docker volume ls -q) 2>/dev/null || true
        docker network rm $(docker network ls -q --filter "name=wp_net") 2>/dev/null || true
        rm -rf /var/lib/docker/volumes/wp_*
        rm -rf /var/lib/docker/volumes/postgres_*

    - name: Очистка Docker системы
      shell: docker system prune -af
      ignore_errors: yes

    - name: Перезапуск Docker
      service:
        name: docker
        state: restarted

    - name: Вывод информации о портах
      debug:
        var: ports_check.stdout_lines

- name: Установка Docker и PostgreSQL для развертывания Wordpress
  hosts: all
  become: true
  vars:
    docker_users: [vald3mar]
    mysql_root_pass: root
    mysql_db: wordpress
    mysql_user: wp_user
    mysql_pass: wp_pass
    wp_port: 80
    db_port: 3306
    wp_network: wp_net


  tasks:
    - name: Установка Docker
      block:
        - name: Установка нужных пакетов
          ansible.builtin.apt:
            name: "{{ item }}"
            state: present
            update_cache: true
          loop:
            - apt-transport-https
            - ca-certificates
            - curl
            - software-properties-common

        - name: Добавить GPG-ключ Docker
          ansible.builtin.apt_key:
            url: https://download.docker.com/linux/ubuntu/gpg
            state: present

        - name: Добавление Docker репозитория
          ansible.builtin.apt_repository:
            repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ansible_lsb.codename}} stable"
            state: present
            mode: "0644"

        - name: Установить Docker
          ansible.builtin.apt:
            name: "{{ item }}"
            state: present
            update_cache: true
          loop:
            - docker-ce
            - docker-ce-cli
            - containerd.io

        - name: Добавить пользователя в группу Docker
          ansible.builtin.user:
            name: "{{ ansible_user }}"
            groups: docker
            append: true
            
        - name: Запустить Docker
          ansible.builtin.service:
            name: docker
            state: started
            enabled: true

    - name: Инициализация Docker-сети
      docker_network:
        name: "{{ wp_network }}"
        state: present

    - name: Запустить контейнер с MySQL и проверить статус
      block:
      - name: Установка контейнера
        community.docker.docker_container:
          name: mysql_db
          image: mysql:8.0
          restart_policy: always
          env:
            MYSQL_ROOT_PASSWORD: "{{ mysql_root_pass }}"
            MYSQL_DATABASE: "{{ mysql_db }}"
            MYSQL_USER: "{{ mysql_user }}"
            MYSQL_PASSWORD: "{{ mysql_pass }}"
          ports:
            - "{{ db_port }}:{{ db_port }}"
          networks:
            - name: "{{ wp_network }}"
          volumes:
            - mysql_data:/var/lib/mysql

    - name: Запустить контейнер с WordPress
      community.docker.docker_container:
        name: wordpress
        image: wordpress:latest
        restart_policy: always
        env:
          WORDPRESS_DB_HOST: "mysql_db:{{ db_port }}"
          WORDPRESS_DB_NAME: "{{ mysql_db }}"
          WORDPRESS_DB_USER: "{{ mysql_user }}"
          WORDPRESS_DB_PASSWORD: "{{ mysql_pass }}"
          WORDPRESS_DEBUG: "1"
        ports:
          - "{{ wp_port }}:80"
        networks:
          - name: "{{ wp_network }}"
        volumes:
          - wp_data:/var/www/html
        healthcheck:
          test: ["CMD-SHELL", "curl -f http://localhost/wp-admin/install.php || exit 1"]
          interval: 15s
          timeout: 10s
          retries: 3

              


            

          